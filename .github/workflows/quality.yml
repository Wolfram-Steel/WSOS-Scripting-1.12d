name: quality-and-security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            config/requirements.txt
            requirements-dev.txt
      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r config/requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Bandit security scan
        run: bandit -r core/ app/
      - name: Safety dependency scan
        run: safety check -r config/requirements.txt
      - name: Mypy type check
        run: mypy core/ app/
      - name: Tests
        run: python -m pytest -q
